name: Scraping zilnic preturi PC

on:
  schedule:
    # Declansam noaptea: job-ul asteapta in coada pana porneste PC-ul (runner self-hosted),
    # apoi ruleaza imediat. GitHub tine job-urile in coada maxim 24h.
    # 00:07 UTC = 02:07 ora Chisinau iarna (03:07 vara). In fiecare zi (PC-ul ramane pornit, blocat cu Win+L, si in weekend).
    - cron: "7 0 * * *"
  workflow_dispatch: {}   # permite rulare manuala din tab-ul Actions

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Instaleaza dependente
        run: |
          py -m pip install playwright requests
          py -m playwright install chromium

      - name: Ruleaza scraper-ul
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: py scraper.py
