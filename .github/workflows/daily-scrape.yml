name: Scraping zilnic preturi PC

on:
  schedule:
    # 06:00 UTC = 09:00 ora Chisinau (vara) / 08:00 (iarna)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permite rulare manuala din tab-ul Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Instaleaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaleaza dependente
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Ruleaza scraper-ul
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py
