name: Scraping zilnic preturi PC

on:
  schedule:
    # 06:00 UTC = 09:00 ora Chisinau (vara) / 08:00 (iarna)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permite rulare manuala din tab-ul Actions

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Instaleaza dependente
        run: |
          py -m pip install playwright requests
          py -m playwright install chromium

      - name: Ruleaza scraper-ul
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: py scraper.py
